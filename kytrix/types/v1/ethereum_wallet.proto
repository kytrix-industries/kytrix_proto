syntax = "proto3";
package kytrix.types.v1;

message EthereumWalletSelection {
  string address = 1;
  sfixed64 created_at = 2;
}

message EthereumWalletEvent {
  string event_id = 1;
  string from_address = 2;
  string to_address = 3;
  string amount = 4;
  string token_symbol = 5;
  sfixed64 timestamp = 6;
}
