syntax = "proto3";
package kytrix.types;

message XProfile {
  string x_user_id       = 1;
  string username        = 2;
  string display_name    = 3;
  string avatar_url      = 4;
  bool   verified        = 5;
  uint64 revision        = 6;
  string description     = 7;
  uint64 followers_count = 8;
  uint64 following_count = 9;
  bool   protected       = 10;
}

enum XSelectionStatus {
  X_SELECTION_STATUS_UNSPECIFIED = 0;
  X_PENDING                      = 1;
  X_ACTIVE                       = 2;
  X_PAUSED                       = 3;
}

message XSelection {
  string           x_user_id  = 1;
  XSelectionStatus status     = 2;
  sfixed64         created_at = 3;
  sfixed64         updated_at = 4;
  XProfile         profile    = 5;
}

message TweetTextSegment {
  string          text = 1;
  optional string url  = 2;
}

message Tweet {
  string                    tweet_id      = 1;
  sfixed64                  timestamp     = 2;
  repeated TweetTextSegment text_segments = 3;

  oneof reference {
    Tweet repost = 4;
    Tweet quote  = 5;
  }

  string              x_user_id = 6;
  repeated TweetMedia media     = 7;
}

message TweetMedia {
  oneof content {
    Image image = 1;
    Video video = 2;
    Gif   gif   = 3;
  }

  message Image {
    string image_url = 1;
    uint32 width     = 2;
    uint32 height    = 3;
  }

  message Video {
    string playback_url  = 1;
    string thumbnail_url = 2;
    uint32 width         = 3;
    uint32 height        = 4;
  }

  message Gif {
    string animation_url = 1;
    string image_url     = 2;
    uint32 width         = 3;
    uint32 height        = 4;
  }
}

message TweetBatch {
  repeated Tweet    tweets   = 1;
  repeated XProfile profiles = 2;
}
