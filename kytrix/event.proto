syntax = "proto3";
package kytrix;

import "types/v1/ethereum_wallet.proto";
import "types/v1/financial_index.proto";
import "types/v1/global_shipping_chokepoint.proto";
import "types/v1/news.proto";
import "types/v1/solana_wallet.proto";
import "types/v1/x.proto";

message Event {
  oneof event {
    types.v1.News news = 1;
    types.v1.FinancialIndex financial_index = 2;
    types.v1.XPost x_post = 3;
    types.v1.EthereumWalletEvent ethereum_wallet_event = 4;
    types.v1.XUserProfile x_user_profile = 5;
    types.v1.GlobalShippingChokepointEvent global_shipping_chokepoint_event = 6;
    types.v1.SolanaWalletEvent solana_wallet_event = 7;
  }
}
