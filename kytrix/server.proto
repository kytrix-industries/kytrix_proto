syntax = "proto3";
package kytrix.server;

import "event.proto";
import "topic.proto";
import "types/etf.proto";
import "types/index.proto";
import "types/x.proto";
import "types/wallet.proto";

message ServerMessage{
  oneof message{
    Response     response      = 1;
    event.Event  event         = 2;
    SessionState session_state = 3;
    AuthChallenge auth_challenge = 4;
  }
}

message Response{
  uint32 id = 1;

  oneof response{
    ErrorResponse            error             = 100;
    SetSubscriptionsResponse set_subscriptions = 101;
    ReauthenticateResponse   reauthenticate    = 102;
    EtfResponse              etf               = 103;
    IndexManifestResponse    index_manifest    = 104;
    XSearchResponse          x_search          = 105;
    XSelectionsResponse      x_selections      = 106;
    XAddSelectionResponse    x_add_selection   = 107;
    XDeleteSelectionResponse x_delete_selection = 108;
    XTweetsResponse          x_tweets          = 109;
    WalletSelectionsResponse wallet_selections = 110;
    WalletAddSelectionResponse wallet_add_selection = 111;
    WalletDeleteSelectionResponse wallet_delete_selection = 112;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED                = 0;
  ERROR_CODE_RATE_LIMIT                 = 1;
  ERROR_CODE_ENTITLEMENT_REQUIRED       = 2;
  ERROR_CODE_INDEX_TOPIC_LIMIT_EXCEEDED = 3;
  ERROR_CODE_INVALID_TOPIC              = 4;
  ERROR_CODE_AUTHENTICATION_UNAVAILABLE = 5;
  ERROR_CODE_INVALID_REQUEST             = 6;
  ERROR_CODE_NOT_READY                   = 7;
  ERROR_CODE_INVALID_ARGUMENT            = 8;
  ERROR_CODE_NOT_FOUND                   = 9;
  ERROR_CODE_QUOTA_EXCEEDED              = 10;
  ERROR_CODE_PROTECTED_ACCOUNT           = 11;
  ERROR_CODE_UPSTREAM_UNAVAILABLE        = 12;
  ERROR_CODE_TIMEOUT                     = 13;
  ERROR_CODE_MUTATION_UNKNOWN            = 14;
  ERROR_CODE_PROTOCOL                    = 15;
}

message ErrorResponse {
  ErrorCode code = 1;
}

message SetSubscriptionsResponse{
  repeated topic.Topic topics = 1;
}

message ReauthenticateResponse {}

message EtfResponse {
  types.ETF etf = 1;
}

message IndexManifestResponse {
  types.IndexManifest manifest = 1;
}

message XSearchResponse {
  repeated types.XProfile profiles = 1;
}

message XSelectionsResponse {
  repeated types.XSelection selections = 1;
  uint32 x_account_limit = 2;
}

message XAddSelectionResponse {
  types.XSelection selection = 1;
}

message XDeleteSelectionResponse {}

message XTweetsResponse {
  types.TweetBatch batch = 1;
}

message WalletSelectionsResponse {
  repeated types.WalletSelection selections = 1;
  uint32 wallet_address_limit = 2;
}

message WalletAddSelectionResponse {
  types.WalletSelection selection = 1;
}

message WalletDeleteSelectionResponse {}

message AuthChallenge {
  string nonce     = 1;
  int64  expires_at = 2;
}

message SessionState {
  uint64          entitlement_revision = 1;
  bool            news_read            = 2;
  uint32 index_topic_limit             = 3;
  optional int64  next_change_at       = 4;
  uint32          wallet_address_limit = 5;
}
